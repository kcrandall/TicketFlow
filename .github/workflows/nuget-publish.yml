name: NuGet Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional canonical SemVer override; no build metadata."
        type: string
        required: false
      prerelease:
        description: "Lockstep release channel."
        type: choice
        required: true
        default: alpha
        options: [alpha, beta, stable]
      target:
        description: "Dry run validates artifacts without publishing."
        type: choice
        required: true
        default: dry-run
        options: [dry-run, public]
      confirm_public_publish:
        description: "Type publish-public to authorize public NuGet publication."
        type: string
        required: false
      confirm_stable_publish:
        description: "For stable publication, also type the exact stable version."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ticketflow-nuget-release
  cancel-in-progress: false

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    # pack.sh runs the full solution tests, including PostgreSQL contracts.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: ticketflow-ci-only
          POSTGRES_DB: ticketflow_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TICKETFLOW_TEST_POSTGRES: Host=localhost;Port=5432;Username=ticketflow;Password=ticketflow-ci-only;Database=ticketflow_tests
      TICKETFLOW_REQUIRE_POSTGRES: "1"
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_PRERELEASE: ${{ inputs.prerelease }}
      PUBLISH_TARGET: ${{ inputs.target }}
      CONFIRM_PUBLIC_PUBLISH: ${{ inputs.confirm_public_publish }}
      CONFIRM_STABLE_PUBLISH: ${{ inputs.confirm_stable_publish }}
    steps:
      - name: Validate release request
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "::error::Release workflows must be dispatched from main."
            exit 1
          fi
          if [[ "${PUBLISH_TARGET}" == public && "${CONFIRM_PUBLIC_PUBLISH}" != publish-public ]]; then
            echo "::error::Public publication requires publish-public confirmation."
            exit 1
          fi
          if [[ "${PUBLISH_TARGET}" == public && "${INPUT_PRERELEASE}" == stable && -z "${CONFIRM_STABLE_PUBLISH}" ]]; then
            echo "::error::Stable publication also requires an exact-version confirmation."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Release script regression tests
        run: bash scripts/test-release-scripts.sh
      - name: Resolve lockstep version
        id: version
        run: |
          VERSION="$(bash scripts/resolve-version.sh --version "${INPUT_VERSION}" --prerelease "${INPUT_PRERELEASE}")"
          if [[ -z "${INPUT_VERSION}" && "${INPUT_PRERELEASE}" != stable ]]; then
            VERSION="${VERSION}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ "${PUBLISH_TARGET}" == public && "${INPUT_PRERELEASE}" == stable && "${CONFIRM_STABLE_PUBLISH}" != "${VERSION}" ]]; then
            echo "::error::Stable confirmation must match the resolved version: ${VERSION}."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build, test, and pack release
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/pack.sh --version "${RESOLVED_VERSION}" --prerelease "${INPUT_PRERELEASE}"
      - name: Verify package contents and checksums
        run: bash scripts/verify-package-contents.sh --package-dir artifacts/nuget
      - name: Local NuGet consumer smoke
        run: bash scripts/smoke-package-consumption.sh --package-dir artifacts/nuget
      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ticketflow-nuget-${{ github.run_id }}
          path: artifacts/nuget/
          if-no-files-found: error

  publish:
    needs: build-release
    if: ${{ inputs.target == 'public' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.prerelease == 'stable' && 'nuget-stable' || 'nuget-prerelease' }}
    permissions:
      contents: read
      # NuGet trusted publishing exchanges this job's OIDC token for a short-lived API key.
      id-token: write
    env:
      INPUT_PRERELEASE: ${{ inputs.prerelease }}
      CONFIRM_PUBLIC_PUBLISH: ${{ inputs.confirm_public_publish }}
      CONFIRM_STABLE_PUBLISH: ${{ inputs.confirm_stable_publish }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Download tested release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ticketflow-nuget-${{ github.run_id }}
          path: artifacts/nuget/
      - name: Verify unchanged release bytes
        run: bash scripts/verify-package-contents.sh --package-dir artifacts/nuget
      - name: Log in to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: kcrandall
      - name: Publish existing artifacts
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: bash scripts/publish-nuget.sh
